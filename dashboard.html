<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vagas PO / PM / BA</title><style>
:root{--bg:#f7f6f3;--fg:#1c1c1a;--mut:#6b6a64;--card:#fff;--bd:#e2e0d8;--ac:#1f6f5c}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eceae3;--mut:#9a988f;--card:#201f1c;--bd:#33312c;--ac:#5fc4a8}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 16px}h1{margin:0 0 4px;font-size:26px}
.mut{color:var(--mut);font-size:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.score{font-weight:700;color:var(--ac);font-size:22px}a{color:var(--ac)}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}</style></head><body><main>
<h1>Vagas PO / PM / Business Analyst</h1>
<div class="mut" id="meta"></div><div id="lista"></div>
<h2 style="font-size:18px;margin-top:32px">Páginas de carreira (conferência manual)</h2><div class="links"><a href="https://ciandt.com/br/pt-br/carreiras" target="_blank" rel="noopener">CI&T</a><a href="https://zup.gupy.io" target="_blank" rel="noopener">Zup Innovation</a><a href="https://www.gft.com/br/pt/careers" target="_blank" rel="noopener">GFT Technologies</a><a href="https://dbccompany.gupy.io" target="_blank" rel="noopener">DBC Company</a><a href="https://compassuol.gupy.io" target="_blank" rel="noopener">Compass UOL</a><a href="https://stefanini.gupy.io" target="_blank" rel="noopener">Stefanini</a><a href="https://www.accenture.com/br-pt/careers/jobsearch" target="_blank" rel="noopener">Accenture</a><a href="https://www.thoughtworks.com/pt-br/careers/jobs" target="_blank" rel="noopener">Thoughtworks</a><a href="https://arctouch.com/careers" target="_blank" rel="noopener">ArcTouch</a><a href="https://lwsa.gupy.io" target="_blank" rel="noopener">LWSA</a><a href="https://carreiras.totvs.com" target="_blank" rel="noopener">RD Station (TOTVS)</a><a href="https://jobs.sap.com/go/SAP-Jobs-in-Brazil/" target="_blank" rel="noopener">SAP</a><a href="https://omie.gupy.io" target="_blank" rel="noopener">Omie</a><a href="https://asaas.gupy.io" target="_blank" rel="noopener">Asaas</a><a href="https://contaazul.gupy.io" target="_blank" rel="noopener">Conta Azul</a><a href="https://vtex.com/br-pt/carreiras/" target="_blank" rel="noopener">VTEX</a><a href="https://sympla.gupy.io" target="_blank" rel="noopener">Sympla</a><a href="https://boticario.gupy.io" target="_blank" rel="noopener">Grupo Boticário</a><a href="https://naturaeco.gupy.io" target="_blank" rel="noopener">Natura &Co</a><a href="https://carreiras.ifood.com.br" target="_blank" rel="noopener">iFood</a><a href="https://www.dentsu.com/br/pt/careers" target="_blank" rel="noopener">Dentsu</a></div>
</main><script>
const D=/*JOBS*/{"atualizado":"nunca (script ainda não rodou)","vagas":[]}/*END*/;
document.getElementById("meta").textContent="Aderência ≥ 80% · publicadas há até 2 dias · atualizado: "+D.atualizado;
const L=document.getElementById("lista");
if(!D.vagas.length)L.innerHTML='<div class="card mut">Nenhuma vaga encontrada com os critérios.</div>';
D.vagas.forEach(v=>{const d=document.createElement("div");d.className="card";
d.innerHTML=`<div class="row"><div><strong></strong><div class="mut"></div></div><div class="score">${v.aderencia}%</div></div><a target="_blank" rel="noopener">Ver vaga →</a>`;
d.querySelector("strong").textContent=v.titulo;d.querySelector(".mut").textContent=v.empresa+" · "+v.local+" · "+new Date(v.publicada).toLocaleString("pt-BR");
d.querySelector("a").href=v.link;L.appendChild(d)});</script></body></html>
