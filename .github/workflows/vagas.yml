name: Buscar vagas

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 17 * * *"
    - cron: "30 21 * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar busca
        run: python buscar_vagas.py
      - name: Salvar dashboard
        run: |
          git config user.name "vagas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Atualiza vagas" || exit 0
          git push
